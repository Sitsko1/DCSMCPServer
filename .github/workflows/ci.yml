name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    # WinUI app + x64 platform pinned in DcsMcp.slnx need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # dotnet build doesn't produce the MSIX package, so no signing certificate is needed here.
      - run: dotnet build DcsMcp.slnx

      - run: dotnet test DcsMcp.slnx --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
